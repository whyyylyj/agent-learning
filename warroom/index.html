<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>佣金宝后端面试作战室</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="layout">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-logo">佣</div>
      <div>
        <div class="brand-title">佣金宝 · 面试作战室</div>
        <div class="brand-sub">Java 后端 · 8 年经验版</div>
      </div>
    </div>
    <div class="search-box">
      <input type="search" id="search" placeholder="搜索问题 / 关键词…（如：幂等、B+树、RAG）" autocomplete="off">
    </div>
    <div class="mode-switch">
      <button id="modeLearn" class="mode-btn active" title="完整展示话术与答案">📖 学习模式</button>
      <button id="modeTest" class="mode-btn" title="隐藏答案，先自测再展开">🎯 自测模式</button>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="sidebar-foot">
      <div class="overall">
        <div class="overall-label">总进度</div>
        <div class="bar"><div class="bar-fill" id="overallBar"></div></div>
        <div class="overall-num" id="overallNum">0%</div>
      </div>
      <div class="foot-actions">
        <button id="themeBtn" class="ghost-btn">🌙 夜间</button>
        <button id="resetBtn" class="ghost-btn" title="清空全部勾选进度">↺ 重置</button>
      </div>
    </div>
  </aside>

  <main class="main" id="main">
    <button class="sidebar-toggle" id="sidebarToggle">☰ 目录</button>
    <div id="content"></div>
  </main>
</div>

<script src="data/business.js"></script>
<script src="data/java.js"></script>
<script src="data/spring.js"></script>
<script src="data/mysql.js"></script>
<script src="data/redis.js"></script>
<script src="data/mq.js"></script>
<script src="data/deep-dive.js"></script>
<script src="data/drills.js"></script>
<script src="data/system.js"></script>
<script src="data/ai.js"></script>
<script src="data/agent-design.js"></script>
<script src="data/agent-layers.js"></script>
<script src="data/vitabench.js"></script>
<script src="data/adp.js"></script>
<script src="data/stories.js"></script>
<script src="data/bilibili.js"></script>
<script src="data/finetune.js"></script>
<script src="data/talk.js"></script>
<script src="data/pages.js"></script>
<script src="js/app.js"></script>
</body>
</html>
